---
# Role: ssh-hardening
# Purpose: Enforce SSH hardening baselines via an sshd_config.d drop-in and fail2ban.
#
# Every setting in defaults/main.yml is rendered into one drop-in that sshd
# reads first, then the EFFECTIVE configuration is checked with `sshd -T`, so a
# later drop-in or an old main-file line cannot silently undo the hardening.

# ── Lockout guard ────────────────────────────────────────────────────────

- name: Ensure the SSH allow-group exists
  ansible.builtin.group:
    name: "{{ ssh_allow_groups }}"
    state: present
  when: ssh_allow_groups | length > 0
  tags: ssh

- name: Read local accounts
  ansible.builtin.getent:
    database: passwd
  when: ssh_allow_group_members | length > 0
  tags: ssh

- name: Refuse to add accounts that do not exist
  ansible.builtin.assert:
    that: item in ansible_facts.getent_passwd
    fail_msg: "{{ item }} is not a local account; create it before adding it to {{ ssh_allow_groups }}."
    quiet: true
  loop: "{{ ssh_allow_group_members }}"
  tags: ssh

- name: Add listed accounts to the SSH allow-group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ ssh_allow_groups }}"
    append: true
  loop: "{{ ssh_allow_group_members }}"
  when: ssh_allow_groups | length > 0
  tags: ssh

- name: Read the SSH allow-group
  ansible.builtin.getent:
    database: group
    key: "{{ ssh_allow_groups }}"
  when: ssh_allow_groups | length > 0
  tags: ssh

- name: Refuse to apply AllowGroups to an empty group
  ansible.builtin.assert:
    that: ansible_facts.getent_group[ssh_allow_groups][2] | length > 0
    fail_msg: >-
      AllowGroups {{ ssh_allow_groups }} would lock out every SSH login: the group
      has no members. Set ssh_allow_group_members, or add users to the group first.
  when: ssh_allow_groups | length > 0
  tags: ssh

# ── Configuration ────────────────────────────────────────────────────────

- name: Deploy SSH banner
  ansible.builtin.copy:
    content: "{{ ssh_banner_text }}"
    dest: "{{ ssh_banner_path }}"
    owner: root
    group: root
    mode: "0644"
  when: ssh_banner_enabled
  tags: ssh

- name: Ensure sshd_config.d exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: ssh

- name: Ensure sshd_config includes sshd_config.d first
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Include /etc/ssh/sshd_config\.d/\*\.conf'
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd
  tags: ssh

- name: Deploy hardening drop-in
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd
  tags: ssh

- name: Validate the full sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  tags: ssh

# ── Proof: the settings sshd will actually use ───────────────────────────

- name: Read the effective sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -T
  register: ssh_effective
  changed_when: false
  tags: ssh

- name: Assert the hardening is in effect
  ansible.builtin.assert:
    that: item in ssh_effective.stdout_lines
    fail_msg: >-
      sshd -T does not report "{{ item }}". Another config file is overriding the
      hardening drop-in.
    quiet: true
  loop:
    - "permitrootlogin {{ ssh_permit_root_login }}"
    - "passwordauthentication {{ ssh_password_authentication }}"
    - "pubkeyauthentication {{ ssh_pubkey_authentication }}"
    - "x11forwarding {{ ssh_x11_forwarding }}"
    - "allowtcpforwarding {{ ssh_allow_tcp_forwarding }}"
    - "allowagentforwarding {{ ssh_allow_agent_forwarding }}"
    - "permittunnel {{ ssh_permit_tunnel }}"
    - "permituserenvironment {{ ssh_permit_user_environment }}"
    - "maxauthtries {{ ssh_max_auth_tries }}"
  tags: ssh

# ── fail2ban ─────────────────────────────────────────────────────────────

# Debian 12 ships without rsyslog, so /var/log/auth.log may not exist; read
# the journal instead. The systemd backend needs python3-systemd.
- name: Install fail2ban
  ansible.builtin.apt:
    name:
      - fail2ban
      - python3-systemd
    state: present
  when: ssh_fail2ban_enabled
  tags: fail2ban

- name: Configure fail2ban jail for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.conf
    content: |
      [sshd]
      enabled  = true
      port     = {{ ssh_port }}
      filter   = sshd
      backend  = systemd
      maxretry = {{ ssh_fail2ban_maxretry }}
      bantime  = {{ ssh_fail2ban_bantime }}
      findtime = {{ ssh_fail2ban_findtime }}
    owner: root
    group: root
    mode: "0644"
  when: ssh_fail2ban_enabled
  notify: Restart fail2ban
  tags: fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
  when: ssh_fail2ban_enabled
  tags: fail2ban

# ── Apply and confirm ────────────────────────────────────────────────────

- name: Restart sshd now if its configuration changed
  ansible.builtin.meta: flush_handlers
  tags: ssh

- name: Verify SSH is listening on configured port
  ansible.builtin.command: ss -tlnp
  register: ssh_listen_check
  changed_when: false
  tags: ssh

- name: Assert SSH is listening
  ansible.builtin.assert:
    that:
      - "':' + (ssh_port | string) in ssh_listen_check.stdout"
    fail_msg: "SSH is not listening on port {{ ssh_port }}"
    success_msg: "SSH confirmed listening on port {{ ssh_port }}"
  tags: ssh
